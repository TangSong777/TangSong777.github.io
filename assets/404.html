<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>页面不存在 | 学习与思考</title>
<style>
  :root {
    --canvas: #f2f7f6;
    --paper: #ffffff;
    --ink: #1c2b2a;
    --muted: #5f7573;
    --line: #d8e5e3;
    --green: #4d7572;
    --green-deep: #33544f;
    --green-raw: #6a8d8c;
    --green-soft: #e6efee;
    --amber: #d98324;
    --rose: #c25b7e;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    align-items: center;
    background:
      radial-gradient(ellipse 1000px 520px at 88% -10%, rgba(217, 131, 36, .13), transparent 62%),
      radial-gradient(ellipse 900px 460px at 4% 104%, rgba(194, 91, 126, .10), transparent 58%),
      var(--canvas);
    color: var(--ink);
    display: flex;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    justify-content: center;
    margin: 0;
    min-height: 100vh;
    padding: 28px 20px;
  }
  .bar {
    background: linear-gradient(100deg, var(--green-deep) 0%, var(--green-deep) 44%, var(--green-raw) 62%, var(--amber) 90%, var(--amber) 100%);
    height: 4px;
    left: 0;
    position: fixed;
    right: 0;
    top: 0;
  }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 22px 60px rgba(28, 64, 55, .10);
    max-width: 560px;
    overflow: hidden;
    padding: 40px 40px 34px;
    position: relative;
    width: 100%;
  }
  .card::before {
    background: linear-gradient(90deg, var(--green-deep) 0%, var(--green-raw) 34%, var(--amber) 70%, var(--rose) 100%);
    content: "";
    height: 4px;
    left: 0;
    position: absolute;
    right: 0;
    top: 0;
  }
  .code {
    color: var(--green-deep);
    font-size: 62px;
    font-weight: 700;
    letter-spacing: .06em;
    line-height: 1;
    margin: 6px 0 18px;
  }
  .code span {
    background: linear-gradient(120deg, var(--green) 0%, var(--green-raw) 45%, var(--amber) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 {
    border-left: 3px solid var(--green);
    color: var(--green-deep);
    font-size: 20px;
    letter-spacing: .02em;
    margin: 0 0 12px;
    padding-left: 10px;
  }
  p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.85;
    margin: 0 0 22px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .actions a {
    border-radius: 9px;
    border: 1px solid var(--line);
    color: var(--green-deep);
    font-size: 13.5px;
    padding: 9px 16px;
    text-decoration: none;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .actions a:hover { background: var(--green-soft); border-color: var(--green-raw); }
  .actions a.primary {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .actions a.primary:hover {
    background: var(--green-deep);
    border-color: var(--green-deep);
  }
  .foot {
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    margin-top: 26px;
    padding-top: 14px;
  }
  @media (max-width: 480px) {
    .card { padding: 30px 22px 26px; }
    .code { font-size: 48px; }
    h1 { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="bar"></div>
<main class="card">
  <div class="code"><span>404</span></div>
  <h1>这一页不在这里</h1>
  <p>链接可能已经改过，或者这篇文章被移动、合并到了别处。可以从下面的入口重新找起。</p>
  <div class="actions">
    <a class="primary" href="/">回首页</a>
    <a href="/archives/">文章归档</a>
    <a href="/siyuan/">学习笔记</a>
  </div>
  <div class="foot">学习与思考 · yanghanlin.cn</div>
</main>
</body>
</html>
